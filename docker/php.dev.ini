; Development-mode override, mounted over zz-app.ini by docker-compose.dev.yml.
; Everything matches the production php.ini except OPcache, which must notice
; edited files. This is the ONLY behavioural difference between the two modes.

; --- Uploads and request size -------------------------------------------------
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_input_time = 300
max_execution_time = 300
max_input_vars = 5000

; --- Errors -------------------------------------------------------------------
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; --- Timezone / locale --------------------------------------------------------
date.timezone = UTC
default_charset = "UTF-8"

; --- OPcache (dev) ------------------------------------------------------------
; Production sets validate_timestamps = 0 because the code never changes inside
; the image. Here the code IS mounted, so staleness checks must stay on or edits
; would be silently ignored.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
