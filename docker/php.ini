; PHP runtime settings for the container.
; Loaded after the base php.ini (zz- prefix), so these values win.

; --- Uploads and request size -------------------------------------------------
; The app imports XLSX/CSV files and exports Excel/PDF reports. PHP's defaults
; (2M upload / 8M post / 128M memory) are too small for either.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_input_time = 300
max_execution_time = 300
max_input_vars = 5000

; --- Errors -------------------------------------------------------------------
; Laravel writes to the `stderr` channel (LOG_CHANNEL=stderr), so container logs
; stay clean. Never echo errors into HTTP responses.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; --- Timezone / locale --------------------------------------------------------
date.timezone = UTC
default_charset = "UTF-8"

; --- OPcache ------------------------------------------------------------------
; The application code is baked into the image and never changes at runtime, so
; timestamp validation is unnecessary.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
