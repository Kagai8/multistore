# Local Docker stack: one command, no host dependencies.
#
#   docker compose up --build
#
# Local only. This file is never used in production — a live deployment sets the
# same variables in the platform dashboard and points DB_* at a managed Postgres.

name: multi-store

services:
  db:
    # Matches the host server (Postgres.app 18) so dumps restore without
    # cross-major-version surprises.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: secret
      # Postgres 18 images default PGDATA to /var/lib/postgresql/18/docker.
      # Pinned here so the volume below is the one that actually persists.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      # 5433 on the host: your Homebrew Postgres already owns 5432.
      - "5433:5432"

  mail:
    # Catches every email the app sends. Web inbox: http://localhost:8026
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      # 8026 on the host: the single_store stack already owns 8025.
      - "8026:8025"

  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Overrides .env.docker. Kept literal (no ${...}) so the project's own
      # .env can never leak into this stack through compose interpolation.
      PORT: "8080"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8090
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: inventory_db
      DB_USERNAME: inventory
      DB_PASSWORD: secret
    ports:
      # Host 8090 -> container 8080. 8080 is already taken on this machine by
      # the separate single_store stack.
      - "8090:8080"
    volumes:
      # Product, brand, category and company-logo uploads survive a down/up.
      - storage-public:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  pgdata:
  storage-public:
